product:
  type: kmp/lib
  platforms: [ jvm, android ]

dependencies:
  - ../drop: exported
  - $compose.foundation: exported
  - # noinspection AmperCanConvertToCatalogVersion
   org.jetbrains.compose.material3:material3:1.12.0-alpha03: exported
  - org.jetbrains.compose.material:material-icons-core:1.7.3
  - org.jetbrains.androidx.navigation3:navigation3-ui:1.1.1

  - $compose.ui
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - $kotlin.serialization.json
  - io.ktor:ktor-client-core:3.3.0
  - io.ktor:ktor-client-cio:3.3.0
  - io.insert-koin:koin-core:4.2.2
  - $compose.preview
  - $compose.material

test-dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
  - $kotlin.test: compile-only

dependencies@android:
  - androidx.activity:activity-compose:1.13.0
  - $compose.preview
  - io.insert-koin:koin-android:4.2.2

settings:
  kotlin:
    version: 2.4.20
    freeCompilerArgs: [ -Xexpect-actual-classes ]
    serialization: enabled
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: io.insert-koin:koin-compiler-plugin:1.2.1
        options:
          compileSafety: "true"
          moduleId: "sunrise-shared"
  compose:
    enabled: true
    version: 1.12.1
    resources:
      packageName: ink.lipoly.app.sunrise.resources
  junit: junit-4
  android:
    namespace: ink.lipoly.app.sunrise.shared
    compileSdk: 37
    minSdk: 24